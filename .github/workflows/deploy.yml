name: Deploy Website Image to GHCR

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: limodrop
          password: ${{ secrets.GHCR_PAT }}

      - name: Build image
        run: |
          docker build -t ghcr.io/limodrop/website-www:latest .

      - name: Push image
        run: |
          docker push ghcr.io/limodrop/website-www:latest

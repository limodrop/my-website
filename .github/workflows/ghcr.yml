name: Build and Push Website to GHCR

on:
  push:
    branches: ["main", "deploy-ghcr"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ali --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/ali/website:latest .
          docker tag ghcr.io/ali/website:latest ghcr.io/ali/website:sha-${{ github.sha }}

      - name: Push image
        run: |
          docker push ghcr.io/ali/website:latest
          docker push ghcr.io/ali/website:sha-${{ github.sha }}
